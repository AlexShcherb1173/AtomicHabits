name: CI/CD (lint, tests, docker build, deploy via SCP)

on:
  push:
    branches: ["feature"]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_TAG: "atomichabits:latest"
  TAR_NAME: "atomichabits_latest.tar"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Ruff check
        run: ruff check .

  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: AtomicHabits_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd="pg_isready -U postgres -d AtomicHabits_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DJANGO_SECRET_KEY: test-secret
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"

      POSTGRES_DB: AtomicHabits_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_USERNAME: ""
      TELEGRAM_API_URL: "https://api.telegram.org"

      SMTP_HOST: "smtp.example.com"
      SMTP_PORT: "587"
      SMTP_USE_TLS: "True"
      SMTP_USER: ""
      SMTP_PASSWORD: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov

      - name: Migrate (CI)
        run: |
          python manage.py migrate --noinput

      - name: Pytest with coverage
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker_build:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f docker/django/Dockerfile -t ${{ env.IMAGE_TAG }} .

  deploy:
    name: Deploy to server (SCP + docker load + compose up)
    runs-on: ubuntu-latest
    needs: docker_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f docker/django/Dockerfile -t ${{ env.IMAGE_TAG }} .

      - name: Save image to tar
        run: |
          docker save -o ${{ env.TAR_NAME }} ${{ env.IMAGE_TAG }}

      - name: Setup SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf "%s" "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists
        shell: bash
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}/docker/nginx'"

      - name: Upload compose + nginx + tar
        shell: bash
        env:
          TAR_NAME: ${{ env.TAR_NAME }}
        run: |
          set -euo pipefail

          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }}" \
            docker-compose.yml \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/docker-compose.yml"

          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }}" \
            docker/nginx/nginx.conf \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/docker/nginx/nginx.conf"

          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }}" \
            "$TAR_NAME" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/$TAR_NAME"

      - name: Upload .env.docker from secret
        shell: bash
        env:
          ENV_DOCKER: ${{ secrets.ENV_DOCKER }}
        run: |
          set -euo pipefail
          TMP_ENV="$(mktemp)"
          printf "%s" "$ENV_DOCKER" > "$TMP_ENV"

          rsync -avz -e "ssh -p ${{ secrets.SSH_PORT }}" \
            "$TMP_ENV" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/.env.docker"

          rm -f "$TMP_ENV"

      - name: Deploy on server (load + up + migrate)
        shell: bash
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          TAR_NAME: ${{ env.TAR_NAME }}
        run: |
          set -euo pipefail
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<SSH
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker load -i "$TAR_NAME"
          docker compose config >/dev/null
          docker compose up -d --remove-orphans --pull=never --no-build
          docker compose exec -T web python manage.py migrate --noinput
          SSH